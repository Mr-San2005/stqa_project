name: CI

on:
  push:
    paths-ignore:
      - reports/latest-test-report.md
  pull_request:
    paths-ignore:
      - reports/latest-test-report.md

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run backend unit tests
        id: backend_tests
        continue-on-error: true
        run: npm run test:ci
      - name: Create Markdown test report
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.backend_tests.outcome }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/writeTestReport.js
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            reports/latest-test-report.md
            backend/test-results/jest-report.json
          if-no-files-found: error
      - name: Save report to repository
        if: always() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ../reports/latest-test-report.md
          if git diff --cached --quiet; then
            echo "Test report is unchanged."
          else
            git commit -m "Update test report"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Mark job failed if tests failed
        if: steps.backend_tests.outcome == 'failure'
        run: exit 1

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
